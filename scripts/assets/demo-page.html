<!doctype html>
<!--
  Demo fixture used only to generate the README animation.

  Append ?fixed=1 to render the corrected layout. The "broken" default is a
  realistic version of the bug VibeLens exists to catch: a CTA that escapes its
  card because of a negative margin plus a fixed width, which reads fine in the
  source and only fails in the browser. It also logs a console error and
  requests a missing asset so the diagnostics half of the payload is non-empty.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme — Pricing</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .wrap { display: flex; gap: 28px; padding: 48px 40px; }
      .card {
        width: 260px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 26px 24px 28px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 12px 28px -18px rgba(15, 23, 42, 0.35);
      }
      .card h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: 0.02em; color: #64748b; text-transform: uppercase; }
      .price { margin: 0 0 18px; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
      .price span { font-size: 14px; font-weight: 500; color: #64748b; }
      ul { margin: 0 0 22px; padding: 0 0 0 18px; color: #475569; }
      li { margin: 6px 0; }
      .cta {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #4f46e5;
        cursor: pointer;
      }
      .card.featured { border-color: #c7d2fe; box-shadow: 0 1px 2px rgba(79, 70, 229, 0.1), 0 18px 34px -20px rgba(79, 70, 229, 0.55); }

      /* The bug: the featured CTA is pulled outside its padded box and given a
         width wider than the card, so it overflows on the right. */
      body:not(.fixed) .card.featured .cta {
        width: 300px;
        margin-left: -22px;
        border-radius: 10px 0 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" id="plan-starter">
        <h2>Starter</h2>
        <p class="price">$0<span> /mo</span></p>
        <ul>
          <li>1 project</li>
          <li>Community support</li>
          <li>1k requests</li>
        </ul>
        <button class="cta" id="cta-starter" style="background:#e2e8f0;color:#0f172a">Get started</button>
      </div>

      <div class="card featured" id="plan-pro">
        <h2>Pro</h2>
        <p class="price">$29<span> /mo</span></p>
        <ul>
          <li>Unlimited projects</li>
          <li>Priority support</li>
          <li>1M requests</li>
        </ul>
        <button class="cta" id="cta-pro" data-testid="cta-pro">Upgrade to Pro</button>
      </div>

      <div class="card" id="plan-team">
        <h2>Team</h2>
        <p class="price">$99<span> /mo</span></p>
        <ul>
          <li>Everything in Pro</li>
          <li>SSO and audit log</li>
          <li>10M requests</li>
        </ul>
        <button class="cta" id="cta-team" style="background:#e2e8f0;color:#0f172a">Contact sales</button>
      </div>
    </div>

    <img src="/badge-secure.png" alt="" width="1" height="1" />

    <script>
      if (new URLSearchParams(location.search).get("fixed") === "1") {
        document.body.classList.add("fixed");
      } else {
        console.error("Warning: Prop `className` did not match. Server: 'cta' Client: 'cta w-full'");
      }
    </script>
  </body>
</html>
