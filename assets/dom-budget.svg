<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Measured DOM reduction: 193520 raw characters become 8890 after sanitization, a 95.4 percent reduction, with class names preserved">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F8F4"/><stop offset="1" stop-color="#EFECE6"/>
    </linearGradient>
    <linearGradient id="raw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C27B66" stop-opacity="0.85"/><stop offset="1" stop-color="#C27B66" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="san" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C9A84"/><stop offset="1" stop-color="#C27B66"/>
    </linearGradient>
  </defs>

  <style>
    .ttl { font: 700 19px -apple-system, BlinkMacSystemFont, 'Playfair Display', Georgia, sans-serif; fill: #2D3A31; }
    .sub { font: 400 13px -apple-system, BlinkMacSystemFont, 'Source Sans 3', sans-serif; fill: #3A473E; }
    .lab { font: 600 13px -apple-system, BlinkMacSystemFont, 'Source Sans 3', sans-serif; fill: #2D3A31; }
    .num { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2D3A31; }
    .cap { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3A473E; }
    .ok  { font: 700 12px -apple-system, BlinkMacSystemFont, 'Source Sans 3', sans-serif; fill: #2D3A31; }
  </style>

  <rect width="1200" height="360" rx="28" fill="url(#dbg)" stroke="#E6E2DA" stroke-width="1.5"/>

  <text x="40" y="52" class="ttl">What actually reaches the model</text>
  <text x="40" y="78" class="sub">One page: 12 cards with base64 images, icon sprites, a framework style block and an inline bundle.</text>

  <!-- raw bar -->
  <text x="40" y="132" class="lab">Raw document.body</text>
  <rect x="40" y="144" width="1040" height="34" rx="8" fill="url(#raw)"/>
  <text x="1096" y="167" class="num">193,520</text>
  <text x="52" y="166" class="cap" fill="#FFFFFF">scripts · style blocks · base64 blobs · SVG path data · full body copy</text>

  <!-- sanitized bar -->
  <text x="40" y="222" class="lab">VibeLens simplifiedDOM</text>
  <rect x="40" y="234" width="1040" height="34" rx="8" fill="#FFFFFF" stroke="#DCCFC2" stroke-width="1"/>
  <rect x="40" y="234" width="47.8" height="34" rx="8" fill="url(#san)"/>
  <text x="1104" y="257" class="num">8,890</text>
  <text x="100" y="256" class="cap">structure · ids · classes · aria · data-testid</text>

  <!-- callouts — no animations, clean static badges -->
  <g transform="translate(40 292)">
    <rect width="228" height="42" rx="10" fill="#8C9A84" fill-opacity="0.2" stroke="#8C9A84" stroke-width="1"/>
    <text x="18" y="26" class="ok">95.4% smaller payload</text>
  </g>
  <g transform="translate(284 292)">
    <rect width="292" height="42" rx="10" fill="#FFFFFF" stroke="#DCCFC2" stroke-width="1"/>
    <text x="18" y="26" class="cap">every utility class still present</text>
  </g>
  <g transform="translate(592 292)">
    <rect width="270" height="42" rx="10" fill="#FFFFFF" stroke="#DCCFC2" stroke-width="1"/>
    <text x="18" y="26" class="cap">hard cap 20,000 chars</text>
  </g>
  <g transform="translate(878 292)">
    <rect width="282" height="42" rx="10" fill="#FFFFFF" stroke="#DCCFC2" stroke-width="1"/>
    <text x="18" y="26" class="cap">reproduce: measure-dom.mjs</text>
  </g>
</svg>
