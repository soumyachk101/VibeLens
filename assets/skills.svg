<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The VibeLens plugin: twelve skills grouped into debugging, design craft and verification, four subagents and two advisory hooks">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C33"/><stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="sac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <style>
    .grp { font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; letter-spacing: .13em; }
    .sk  { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #E2E8F0; }
    .ds  { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; fill: #8494A9; }
    .hd  { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; fill: #F1F5F9; }
    .sb  { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; fill: #94A3B8; }
    .ag  { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #C4B5FD; }
    .hk  { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7DD3FC; }
  </style>

  <rect width="1200" height="620" rx="18" fill="url(#sbg)"/>

  <text x="40" y="48" class="hd">One install adds twelve skills, four subagents and two advisories</text>
  <text x="40" y="72" class="sb">Every skill is slash-invoked and model-invoked, and every one starts by capturing the page.</text>

  <!-- column 1: debugging -->
  <g transform="translate(40 100)">
    <rect width="360" height="252" rx="13" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.24"/>
    <text x="20" y="30" class="grp" fill="#7DD3FC">DEBUGGING</text>
    <g transform="translate(20 54)">
      <text y="14" class="sk">check-ui</text><text y="32" class="ds">capture, fix, re-capture to verify</text>
      <text y="70" class="sk">console-triage</text><text y="88" class="ds">group failures by root cause</text>
      <text y="126" class="sk">responsive-audit</text><text y="144" class="ds">mobile, tablet, desktop breakage</text>
      <text y="182" class="sk">a11y-audit</text><text y="200" class="ds">alt, names, labels, contrast, targets</text>
    </g>
  </g>

  <!-- column 1 lower: knowledge base -->
  <g transform="translate(40 372)">
    <rect width="360" height="176" rx="13" fill="#0D1526" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="20" y="30" class="grp" fill="#94A3B8">KNOWLEDGE BASE</text>
    <g transform="translate(20 54)">
      <text y="14" class="hk">docs/design/ANTI-SLOP.md</text>
      <text y="38" class="hk">TYPOGRAPHY.md · COLOR.md</text>
      <text y="62" class="hk">SPACING-LAYOUT.md · MOTION.md</text>
      <text y="96" class="ds">the rules the skills cite instead</text>
      <text y="114" class="ds">of restating them</text>
    </g>
  </g>

  <!-- column 2: design craft -->
  <g transform="translate(420 100)">
    <rect width="360" height="448" rx="13" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.28"/>
    <text x="20" y="30" class="grp" fill="#C4B5FD">DESIGN CRAFT</text>
    <g transform="translate(20 54)">
      <text y="14" class="sk">design-review</text><text y="32" class="ds">designed, or machine-generated</text>
      <text y="70" class="sk">type-system</text><text y="88" class="ds">scale, measure, leading, tracking</text>
      <text y="126" class="sk">color-system</text><text y="144" class="ds">tokens, ramps, contrast, state colour</text>
      <text y="182" class="sk">layout-audit</text><text y="200" class="ds">spacing scale, optical alignment</text>
      <text y="238" class="sk">motion-system</text><text y="256" class="ds">duration, easing, reduced-motion</text>
      <text y="294" class="sk">micro-interactions</text><text y="312" class="ds">the full state matrix per control</text>
      <text y="350" class="sk">polish-pass</text><text y="368" class="ds">the last-10-percent checklist</text>
    </g>
  </g>

  <!-- column 3: verification -->
  <g transform="translate(800 100)">
    <rect width="360" height="118" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.28"/>
    <text x="20" y="30" class="grp" fill="#6EE7B7">VERIFICATION</text>
    <g transform="translate(20 54)">
      <text y="14" class="sk">before-after</text><text y="32" class="ds">identical parameters, concrete diff</text>
    </g>
  </g>

  <!-- column 3: subagents -->
  <g transform="translate(800 238)">
    <rect width="360" height="234" rx="13" fill="#0D1526" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="20" y="30" class="grp" fill="#94A3B8">SUBAGENTS</text>
    <g transform="translate(20 52)">
      <text y="14" class="ag">ui-debugger</text><text y="32" class="ds">evidence-driven bug fixing</text>
      <text y="66" class="ag">ui-reviewer</text><text y="84" class="ds">pre-merge review, three viewports</text>
      <text y="118" class="ag">design-reviewer</text><text y="136" class="ds">taste verdict, backed by proof</text>
      <text y="170" class="ag">frontend-builder</text><text y="188" class="ds">tokens first, every state built</text>
    </g>
  </g>

  <!-- column 3: hooks -->
  <g transform="translate(800 492)">
    <rect width="360" height="56" rx="13" fill="#0D1526" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="20" y="24" class="grp" fill="#94A3B8">ADVISORIES</text>
    <text x="20" y="44" class="hk">unverified change · raw values found</text>
  </g>

  <rect x="40" y="584" width="1120" height="3" rx="1.5" fill="url(#sac)" opacity="0.5"/>
</svg>
