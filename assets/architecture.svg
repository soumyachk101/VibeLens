<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="VibeLens architecture: IDE host over stdio to the MCP server, capture engine, security guard, DOM sanitizer and headless Chromium">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C33"/><stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="aac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .t  { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #F1F5F9; }
    .f  { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7DD3FC; }
    .d  { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94A3B8; }
    .lb { font: 700 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; letter-spacing: .13em; fill: #64748B; }
    .e  { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748B; }
  </style>

  <rect width="1200" height="470" rx="18" fill="url(#abg)"/>

  <!-- hosts -->
  <text x="40" y="38" class="lb">MCP HOSTS</text>
  <g transform="translate(40 52)">
    <rect width="212" height="150" rx="13" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="18" y="30" class="t">Your IDE</text>
    <g class="d">
      <text x="18" y="56">Claude Code · Codex</text>
      <text x="18" y="76">Cursor · Antigravity</text>
      <text x="18" y="96">Windsurf · VS Code</text>
      <text x="18" y="116">Claude Desktop</text>
    </g>
    <text x="18" y="138" class="e">any MCP client</text>
  </g>

  <!-- transport -->
  <g transform="translate(252 112)">
    <path d="M0 15 H74" stroke="#22D3EE" stroke-width="1.8" marker-end="url(#a2)" fill="none"/>
    <text x="4" y="10" class="e" fill="#7DD3FC">stdio</text>
    <text x="4" y="34" class="e">JSON-RPC</text>
  </g>

  <!-- the server package -->
  <text x="340" y="38" class="lb">MCP-VIBELENS (NODE PROCESS)</text>
  <g transform="translate(340 52)">
    <rect width="470" height="366" rx="14" fill="#0D1526" stroke="#22D3EE" stroke-opacity="0.22"/>

    <g transform="translate(18 20)">
      <rect width="434" height="62" rx="10" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.14"/>
      <text x="16" y="24" class="f">src/index.ts</text>
      <text x="16" y="45" class="d">Entrypoint. Binds StdioServerTransport. Never writes stdout.</text>
    </g>

    <g transform="translate(18 94)">
      <rect width="434" height="76" rx="10" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.14"/>
      <text x="16" y="24" class="f">src/server.ts</text>
      <text x="16" y="45" class="d">Registers inspect_localhost_ui. Zod schema, image+text</text>
      <text x="16" y="63" class="d">assembly, CaptureError to actionable hint.</text>
    </g>

    <g transform="translate(18 182)">
      <rect width="210" height="76" rx="10" fill="#0F172A" stroke="#F87171" stroke-opacity="0.3"/>
      <text x="16" y="24" class="f" fill="#FCA5A5">src/security.ts</text>
      <text x="16" y="45" class="d">SSRF gate. Allowlist</text>
      <text x="16" y="63" class="d">only. Runs first.</text>
    </g>
    <g transform="translate(242 182)">
      <rect width="210" height="76" rx="10" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.3"/>
      <text x="16" y="24" class="f" fill="#C4B5FD">src/dom.ts</text>
      <text x="16" y="45" class="d">Sanitizer, runs in</text>
      <text x="16" y="63" class="d">page. 20k char cap.</text>
    </g>

    <g transform="translate(18 270)">
      <rect width="434" height="76" rx="10" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.14"/>
      <text x="16" y="24" class="f">src/browser.ts</text>
      <text x="16" y="45" class="d">Capture engine. Ephemeral Chromium per call, closed in a</text>
      <text x="16" y="63" class="d">finally block. Bounded navigation and launch timeouts.</text>
    </g>
  </g>

  <!-- chromium + dev server -->
  <text x="850" y="38" class="lb">YOUR MACHINE</text>
  <g transform="translate(850 52)">
    <rect width="310" height="160" rx="13" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="18" y="30" class="t">Headless Chromium</text>
    <g class="d">
      <text x="18" y="56">page.on('console')</text>
      <text x="18" y="76">page.on('pageerror')</text>
      <text x="18" y="96">page.on('requestfailed')</text>
      <text x="18" y="116">page.on('response')  4xx/5xx</text>
      <text x="18" y="140">screenshot: JPEG q75</text>
    </g>
  </g>

  <g transform="translate(850 236)">
    <rect width="310" height="94" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.28"/>
    <text x="18" y="30" class="t">Your dev server</text>
    <text x="18" y="54" class="e" fill="#6EE7B7">localhost · 127.0.0.0/8 · 10/8</text>
    <text x="18" y="74" class="e" fill="#6EE7B7">172.16/12 · 192.168/16 · [::1]</text>
  </g>

  <g transform="translate(850 352)">
    <rect width="310" height="66" rx="13" fill="#0F172A" stroke="#F87171" stroke-opacity="0.3"/>
    <text x="18" y="28" class="t" fill="#FCA5A5">Refused before launch</text>
    <text x="18" y="50" class="e" fill="#FCA5A5">public IPs · DNS names · link-local · metadata</text>
  </g>

  <g stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#a2)">
    <path d="M810 132 H846"/>
    <path d="M1005 212 V232"/>
  </g>
  <path d="M810 300 H830 Q842 300 842 312 V370 H846" stroke="#F87171" stroke-opacity="0.55" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

  <text x="600" y="452" class="e" text-anchor="middle">Full detail: docs/ARCHITECTURE.md · decisions: docs/adr/</text>
</svg>
