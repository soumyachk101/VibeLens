<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="VibeLens - give your AI coding assistant eyes on localhost">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223C"/>
      <stop offset="0.55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#080D18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0B1120" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="240" fill="url(#glow)"/>
  <circle cx="180" cy="290" r="220" fill="url(#glow2)"/>

  <!-- faint grid: a dev-server surface -->
  <g stroke="#94A3B8" stroke-opacity="0.055">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V300M240 0V300M360 0V300M480 0V300M600 0V300M720 0V300M840 0V300M960 0V300M1080 0V300"/>
  </g>

  <!-- lens mark -->
  <g transform="translate(74 92)">
    <circle cx="56" cy="56" r="52" fill="url(#lens)"/>
    <circle cx="56" cy="56" r="52" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <g stroke="#0B1120" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M56 4 L83 42"/>
      <path d="M100 71 L56 71"/>
      <path d="M29 100 L56 62"/>
    </g>
    <circle cx="40" cy="41" r="10" fill="#E2E8F0" opacity="0.92"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#F1F5F9">Vibe<tspan fill="url(#accent)">Lens</tspan></text>
  <text x="214" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#94A3B8">Give your AI coding assistant eyes on localhost.</text>

  <!-- what one tool call returns -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">
    <g transform="translate(214 206)">
      <rect width="164" height="34" rx="17" fill="#22D3EE" fill-opacity="0.09" stroke="#22D3EE" stroke-opacity="0.34"/>
      <circle cx="20" cy="17" r="4" fill="#22D3EE"/>
      <text x="34" y="22" fill="#7DD3FC">Screenshot</text>
    </g>
    <g transform="translate(390 206)">
      <rect width="214" height="34" rx="17" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-opacity="0.32"/>
      <circle cx="20" cy="17" r="4" fill="#F87171"/>
      <text x="34" y="22" fill="#FCA5A5">Console + network</text>
    </g>
    <g transform="translate(616 206)">
      <rect width="196" height="34" rx="17" fill="#A78BFA" fill-opacity="0.09" stroke="#A78BFA" stroke-opacity="0.34"/>
      <circle cx="20" cy="17" r="4" fill="#A78BFA"/>
      <text x="34" y="22" fill="#C4B5FD">Sanitized DOM</text>
    </g>
  </g>

  <!-- MCP badge -->
  <g transform="translate(932 116)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="228" height="68" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="#94A3B8" stroke-opacity="0.18"/>
    <text x="18" y="28" font-size="12" fill="#64748B">one MCP tool</text>
    <text x="18" y="50" font-size="14" font-weight="600" fill="#7DD3FC">inspect_localhost_ui</text>
  </g>

  <rect y="296" width="1200" height="4" fill="url(#accent)"/>
</svg>
