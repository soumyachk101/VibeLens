<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="VibeLens - give your AI coding assistant eyes on localhost">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F8F4"/>
      <stop offset="1" stop-color="#EFECE6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C9A84"/>
      <stop offset="1" stop-color="#C27B66"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#8C9A84" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#2D3A31" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2D3A31" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint grid: a dev-server surface -->
  <g stroke="#2D3A31" stroke-opacity="0.04">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V300M240 0V300M360 0V300M480 0V300M600 0V300M720 0V300M840 0V300M960 0V300M1080 0V300"/>
  </g>

  <!-- lens mark -->
  <g transform="translate(74 92)">
    <circle cx="56" cy="56" r="52" fill="url(#lens)"/>
    <circle cx="56" cy="56" r="52" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <g stroke="#141C16" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M56 4 L83 42"/>
      <path d="M100 71 L56 71"/>
      <path d="M29 100 L56 62"/>
    </g>
    <circle cx="40" cy="41" r="10" fill="#F9F8F4" opacity="0.92"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="132" font-family="'Playfair Display', Georgia, -apple-system, BlinkMacSystemFont, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#2D3A31">Vibe<tspan fill="url(#accent)">Lens</tspan></text>
  <text x="214" y="176" font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="500" fill="#3A473E">Give your AI coding assistant eyes on localhost.</text>

  <!-- what one tool call returns -->
  <g font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="600">
    <g transform="translate(214 206)">
      <rect width="164" height="34" rx="17" fill="#8C9A84" fill-opacity="0.12" stroke="#8C9A84" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4" fill="#8C9A84"/>
      <text x="34" y="22" fill="#5F6D59">Screenshot</text>
    </g>
    <g transform="translate(390 206)">
      <rect width="214" height="34" rx="17" fill="#C27B66" fill-opacity="0.1" stroke="#C27B66" stroke-opacity="0.35"/>
      <circle cx="20" cy="17" r="4" fill="#C27B66"/>
      <text x="34" y="22" fill="#A86550">Console + network</text>
    </g>
    <g transform="translate(616 206)">
      <rect width="196" height="34" rx="17" fill="#8C9A84" fill-opacity="0.12" stroke="#8C9A84" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4" fill="#2D3A31"/>
      <text x="34" y="22" fill="#5F6D59">Sanitized DOM</text>
    </g>
  </g>

  <!-- MCP badge -->
  <g transform="translate(932 116)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="228" height="68" rx="14" fill="#FFFFFF" stroke="#DCCFC2" stroke-width="1"/>
    <text x="18" y="28" font-size="12" fill="#6B7C70">one MCP tool</text>
    <text x="18" y="50" font-size="14" font-weight="600" fill="#C27B66">inspect_localhost_ui</text>
  </g>

  <rect y="296" width="1200" height="4" fill="url(#accent)"/>
</svg>
