<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="VibeLens workflow: prompt, tool call, headless capture, three-part payload, fix, re-verify">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C33"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="wac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arwc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <style>
    .h { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #F1F5F9; }
    .s { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94A3B8; }
    .n { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0B1120; }
    .m { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7DD3FC; }
    .t { font: 700 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; letter-spacing: .12em; fill: #64748B; }
  </style>

  <rect width="1200" height="420" rx="18" fill="url(#wbg)"/>

  <!-- step 1: prompt -->
  <g transform="translate(40 56)">
    <rect width="238" height="130" rx="14" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.16"/>
    <circle cx="24" cy="26" r="10" fill="url(#wac)"/><text x="20.5" y="30" class="n">1</text>
    <text x="44" y="31" class="h">You ask</text>
    <text x="20" y="60" class="s">“the Pro button looks wrong</text>
    <text x="20" y="78" class="s">on localhost:3000/pricing”</text>
    <text x="20" y="103" class="s">No coordinates, no hand-written</text>
    <text x="20" y="121" class="s">bug description.</text>
  </g>

  <!-- step 2: tool call -->
  <g transform="translate(318 56)">
    <rect width="238" height="118" rx="14" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.16"/>
    <circle cx="24" cy="26" r="10" fill="url(#wac)"/><text x="20.5" y="30" class="n">2</text>
    <text x="44" y="31" class="h">Model calls the tool</text>
    <text x="20" y="60" class="m">inspect_localhost_ui</text>
    <text x="20" y="82" class="s">url · viewport · delay · fullPage</text>
    <text x="20" y="103" class="s">SSRF guard runs before launch</text>
  </g>

  <!-- step 3: headless capture -->
  <g transform="translate(596 56)">
    <rect width="238" height="118" rx="14" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.16"/>
    <circle cx="24" cy="26" r="10" fill="url(#wac)"/><text x="20.5" y="30" class="n">3</text>
    <text x="44" y="31" class="h">Headless Chromium</text>
    <text x="20" y="60" class="s">Listeners attach, then navigate,</text>
    <text x="20" y="78" class="s">settle, wait out hydration.</text>
    <text x="20" y="103" class="s">Browser closed in finally.</text>
  </g>

  <!-- step 4: the payload, three parts -->
  <g transform="translate(874 56)">
    <rect width="286" height="118" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.3"/>
    <circle cx="24" cy="26" r="10" fill="url(#wac)"/><text x="20.5" y="30" class="n">4</text>
    <text x="44" y="31" class="h">One payload, three signals</text>
    <g transform="translate(20 46)">
      <rect width="8" height="8" rx="2" fill="#22D3EE"/><text x="18" y="8" class="s">image — JPEG of the render</text>
      <rect y="24" width="8" height="8" rx="2" fill="#F87171"/><text x="18" y="32" class="s">console + failed requests</text>
      <rect y="48" width="8" height="8" rx="2" fill="#A78BFA"/><text x="18" y="56" class="s">DOM with the real classes</text>
    </g>
  </g>

  <g stroke="#64748B" stroke-width="1.6" marker-end="url(#arw)" fill="none">
    <path d="M282 115 H312"/>
    <path d="M560 115 H590"/>
    <path d="M838 115 H868"/>
  </g>

  <!-- bottom row: reason, fix, verify -->
  <g transform="translate(40 240)">
    <rect width="516" height="140" rx="14" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.16"/>
    <circle cx="24" cy="26" r="10" fill="url(#wac)"/><text x="20.5" y="30" class="n">5</text>
    <text x="44" y="31" class="h">Model reasons from evidence, not memory</text>
    <text x="20" y="60" class="s">Sees the overflow in the image. Reads the element in the DOM.</text>
    <text x="20" y="80" class="m">&lt;button id="cta-pro" class="cta"&gt;  width: 300px; margin-left: -22px</text>
    <text x="20" y="106" class="s">Edits the selector that exists, in the component that produced it —</text>
    <text x="20" y="124" class="s">instead of a class it recalled from its own earlier output.</text>
  </g>

  <g transform="translate(596 240)">
    <rect width="564" height="140" rx="14" fill="#0F172A" stroke="#34D399" stroke-opacity="0.28"/>
    <circle cx="24" cy="26" r="10" fill="#34D399"/><text x="20.5" y="30" class="n">6</text>
    <text x="44" y="31" class="h">Re-captures to verify</text>
    <text x="20" y="60" class="s">Same url, same viewport, same delay. The fix is confirmed by a second</text>
    <text x="20" y="78" class="s">capture, so “done” means observed — not assumed.</text>
    <g transform="translate(20 96)">
      <rect width="180" height="28" rx="14" fill="#34D399" fill-opacity="0.1" stroke="#34D399" stroke-opacity="0.35"/>
      <text x="16" y="19" class="s" fill="#6EE7B7">aligned · console clean</text>
    </g>
    <text x="216" y="115" class="s">otherwise: read the DOM again, do not re-guess</text>
  </g>

  <!-- the loop back -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arwc)">
    <path d="M1160 310 H1178 Q1190 310 1190 298 V30 Q1190 18 1178 18 H120 Q108 18 108 30 V50"/>
  </g>
  <text x="700" y="14" class="t" text-anchor="middle">THE LOOP: EVERY CHANGE IS RE-OBSERVED</text>
</svg>
