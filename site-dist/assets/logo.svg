<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VibeLens logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C9A84"/>
      <stop offset="1" stop-color="#C27B66"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8C9A84" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#2D3A31" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#141C16" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(140, 154, 132, 0.4)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 14px rgba(194, 123, 102, 0.5)); }
    }
    @keyframes pulseGlint {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .logo-ring {
      transform-origin: center;
      animation: pulseRing 3.5s ease-in-out infinite;
    }
    .glint {
      transform-origin: 53px 52px;
      animation: pulseGlint 2.5s ease-in-out infinite;
    }
  </style>

  <rect width="128" height="128" rx="28" fill="#2D3A31"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#8C9A84" stroke-opacity="0.4"/>

  <!-- aperture blades: a lens that is also a viewport -->
  <circle cx="64" cy="64" r="34" fill="url(#glass)"/>
  <circle class="logo-ring" cx="64" cy="64" r="34" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <g stroke="#141C16" stroke-width="3.4" stroke-linecap="round" opacity="0.85">
    <path d="M64 30 L82 55"/>
    <path d="M93 74 L64 74"/>
    <path d="M46 93 L64 68"/>
  </g>
  <circle class="glint" cx="53" cy="52" r="7" fill="#F9F8F4" opacity="0.9"/>

  <!-- the "localhost" cursor: signals a dev-server viewport, not a camera -->
  <rect x="24" y="100" width="46" height="7" rx="3.5" fill="#8C9A84" opacity="0.9"/>
  <rect x="76" y="100" width="12" height="7" rx="3.5" fill="#C27B66" opacity="0.9"/>
</svg>
