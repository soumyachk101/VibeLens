<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VibeLens logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0B1120" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0B1120"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#22D3EE" stroke-opacity="0.18"/>

  <!-- aperture blades: a lens that is also a viewport -->
  <circle cx="64" cy="64" r="34" fill="url(#glass)"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <g stroke="#0B1120" stroke-width="3.4" stroke-linecap="round" opacity="0.85">
    <path d="M64 30 L82 55"/>
    <path d="M93 74 L64 74"/>
    <path d="M46 93 L64 68"/>
  </g>
  <circle cx="53" cy="52" r="7" fill="#E2E8F0" opacity="0.9"/>

  <!-- the "localhost" cursor: signals a dev-server viewport, not a camera -->
  <rect x="24" y="100" width="46" height="7" rx="3.5" fill="#22D3EE" opacity="0.75"/>
  <rect x="76" y="100" width="12" height="7" rx="3.5" fill="#A78BFA" opacity="0.9"/>
</svg>
