name: Docs site

on:
  push:
    branches: [website]
    paths:
      - "site/**"
      - "scripts/site/**"
      - "assets/**"
      - "docs/**"
      - "plugin/README.md"
      - "*.md"
      - ".github/workflows/pages.yml"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the server
        run: npm run build

      - name: Verify the site
        run: node scripts/site/check.mjs

      - name: Build the site for Pages
        run: node scripts/site/build.mjs --base /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

