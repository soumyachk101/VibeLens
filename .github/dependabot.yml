version: 2

updates:
  # npm dependencies. Everything is pinned exactly, so Dependabot is the only
  # thing that moves a version here.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    groups:
      # One PR for the low-risk bumps: CI runs the full suite against real
      # Chromium, so a single green run is enough to review them together.
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Playwright majors are handled by hand, never by a bot. The npm package
      # version is coupled to the downloaded browser binary (contributors and CI
      # must re-run `playwright install chromium`) and to the Node engines floor
      # — 1.62 is why this project requires Node >= 20. A major bump can move
      # that floor, which is a breaking change for users, so it needs a
      # deliberate release rather than an auto-merged PR.
      - dependency-name: playwright
        update-types:
          - version-update:semver-major

      # The TypeScript toolchain majors are also opt-in. Verified concretely:
      # typescript 7.0.2 with @types/node 26 fails `npm run typecheck` on this
      # tsconfig with TS2591 ("Cannot find name 'process'"), because major
      # TypeScript releases change module and type resolution. That is a real
      # migration with a decision attached, not a version bump, so it belongs in
      # its own PR rather than in the weekly batch.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

      # vitest majors move the supported Node range (4.x is ^20 || ^22 || >=24),
      # which interacts with the engines floor for the same reason as playwright.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major

      # The MCP SDK defines the wire contract with every IDE. A major bump can
      # change the tool-registration API and the content-block shape, so it is
      # reviewed against a real client before it lands.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types:
          - version-update:semver-major

  # GitHub Actions used by ci.yml and release.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
